services:
  agent-proxy:
    image: ubuntu/squid:latest
    container_name: agent-proxy
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - proxy-net
      - agent-net
    restart: unless-stopped

  agent:
    build: .
    container_name: agent
    networks:
      - agent-net
    depends_on:
      - agent-proxy
    environment:
      - HTTP_PROXY=http://agent-proxy:3128
      - HTTPS_PROXY=http://agent-proxy:3128
      - OPENROUTER_APIKEY=${OPENROUTER_APIKEY:?err}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-cohere/north-mini-code:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-4096}
      - OPENROUTER_TEMPERATURE=${OPENROUTER_TEMPERATURE:-0.0}
      - OPENAI_SDK_SYSTEM_PROMPT=${OPENAI_SDK_SYSTEM_PROMPT:-You are a helpful assistant.}
    volumes:
      - ./input:/input:ro
    entrypoint: ["python", "-m", "app.src.main.main"]

networks:
  agent-net:
    internal: true
  proxy-net:
    driver: bridge

